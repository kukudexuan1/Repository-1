# 标准件库：按轴径/载荷选型，返回规格与承载参数
part_families:
  - id: key
    name: 普通平键（A 型）
    standard: GB/T 1096-2003
    select_by: shaft_diameter
    columns: [d_min, d_max, b, h, t_shaft, t_hub, l_min, l_max]
    units: { b: mm, h: mm, t_shaft: mm, t_hub: mm, l_min: mm, l_max: mm }
    notes: 按轴径 d 选定键的截面 b×h，键长 L 由轮毂宽度决定（略短 5~10mm）并圆整到标准长度系列
