[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "experiments"
version = "0.1.0"
description = "实验框架：证据约束型多智能体机械设计系统"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.27.2",
    "pydantic==2.8.2",
    "scipy==1.14.1",
    "numpy==2.1.1",
    "pandas==2.2.3",
    "pyyaml==6.0.2",
    "rich==13.8.1",
    "tqdm==4.66.5",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "krippendorff==0.6.1",
    "matplotlib==3.9.2",
    "openai==1.51.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["framework*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
