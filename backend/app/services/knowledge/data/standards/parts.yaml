  - id: hex_bolt
    name: 六角头螺栓、螺母与垫圈
    standard: GB/T 5782-2016 / GB/T 6170-2015 / GB/T 97.1-2002
    select_by: nominal_diameter
    columns: [designation, d, pitch, length, grade]
    units: { d: mm, pitch: mm, length: mm }
    notes: 用于箱盖连接、端盖连接及安装固定；具体长度按被连接件厚度和啮合长度确定
    items:
      - { designation: "M8", d: 8, pitch: 1.25, length: 30, grade: "8.8" }
      - { designation: "M10", d: 10, pitch: 1.50, length: 35, grade: "8.8" }
      - { designation: "M12", d: 12, pitch: 1.75, length: 40, grade: "8.8" }
      - { designation: "M16", d: 16, pitch: 2.00, length: 50, grade: "8.8" }

  - id: locating_dowel
    name: 圆柱销定位件
    standard: GB/T 119.1-2000
    select_by: nominal_diameter
    columns: [designation, d, length, material]
    units: { d: mm, length: mm }
    notes: 箱盖与箱座结合面采用两只定位销，销径按结合面尺寸和装配工艺确定
    items:
      - { designation: "8x40", d: 8, length: 40, material: "45钢" }
      - { designation: "10x50", d: 10, length: 50, material: "45钢" }
      - { designation: "12x60", d: 12, length: 60, material: "45钢" }

  - id: shaft_retaining_nut
    name: 轴端圆螺母与止动垫圈
    standard: GB/T 812-1988 / GB/T 858-1988
    select_by: nominal_thread
    columns: [designation, thread, height]
    units: { thread: mm, height: mm }
    notes: 用于轴承或齿轮轴向锁紧；仅在轴端螺纹定位方案中使用
    items:
      - { designation: "KM12", thread: 12, height: 7 }
      - { designation: "KM16", thread: 16, height: 8 }
      - { designation: "KM20", thread: 20, height: 9 }
      - { designation: "KM24", thread: 24, height: 10 }

  - id: shaft_seal
    name: 旋转轴唇形密封圈
    standard: GB/T 13871.1-2007
    select_by: shaft_diameter
    columns: [designation, d, D, b, material]
    units: { d: mm, D: mm, b: mm }
    notes: 输入轴和输出轴外伸处优先采用骨架油封；轴径、座孔和宽度必须与端盖接口一致
    items:
      - { designation: "18x30x7", d: 18, D: 30, b: 7, material: "NBR" }
      - { designation: "20x32x7", d: 20, D: 32, b: 7, material: "NBR" }
