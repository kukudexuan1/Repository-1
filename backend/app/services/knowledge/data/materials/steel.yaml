    notes: 高强度镍铬钼合金钢，适用于重载轴类；设计时应结合供货状态和试样尺寸核实性能

  - id: cast_iron_ht250
    grade: "HT250"
    name: HT250 灰铸铁
    standard: GB/T 9439-2010
    heat_treatment: 铸态
    category: 灰铸铁
    hardness: "180~240 HBW"
    properties:
      density:        { value: 7200,   unit: kg/m**3 }
      elastic_modulus: { value: 130000, unit: MPa }
      poisson_ratio:  { value: 0.25,   unit: "" }
      sigma_b:        { value: 250,    unit: MPa, desc: 抗拉强度 }
      sigma_bc:       { value: 950,    unit: MPa, desc: 抗压强度 }
      thermal_expansion: { value: 10.5, unit: 1/K, desc: 线膨胀系数典型值 }
    applications: [中等载荷减速器箱体, 机座, 支承件]
    notes: 强度和耐磨性高于 HT200，铸造性与减振性较好；壁厚和铸造工艺会影响实际性能
