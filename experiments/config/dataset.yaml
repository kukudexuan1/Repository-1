# 任务数据集划分
# 协议 §3.3：训练/验证/测试集严格隔离，测试集锁定后不得调整系统

split:
  dev:       # 提示开发集，仅用于调整 Prompt 和工具描述
    size: 5
    task_ids:
      - G_001
      - G_002
      - S_001
      - B_001
      - R_001
  val:       # 验证集，用于选择最终配置
    size: 10
    task_ids:
      - G_003
      - G_004
      - G_005
      - G_006
      - S_002
      - S_003
      - S_004
      - B_002
      - B_003
      - R_002
  test:      # 测试集，锁定后不得修改系统
    size: 20
    task_ids:
      - G_007
      - G_008
      - G_009
      - G_010
      - G_011
      - G_012
      - G_013
      - G_014
      - G_015
      - S_005
      - S_006
      - S_007
      - S_008
      - S_009
      - S_010
      - B_004
      - B_005
      - R_003
      - R_004
      - R_005
    locked: true   # 锁定标志：设为 true 后框架拒绝对测试集进行 Prompt 调整

families:
  G:
    name: "单级圆柱齿轮减速器"
    count: 15
    variables: ["功率kW", "输入转速rpm", "传动比", "设计寿命h", "载荷类型"]
  S:
    name: "阶梯轴"
    count: 10
    variables: ["轴径mm", "弯矩Nm", "扭矩Nm", "键槽数量", "材料牌号"]
  B:
    name: "轴承—键—轴组合"
    count: 5
    variables: ["轴径mm", "轴承类型", "寿命h", "挤压载荷N"]
  R:
    name: "逆向建模/图纸理解"
    count: 5
    variables: ["图纸类型", "尺寸数量", "尺寸链层级"]
